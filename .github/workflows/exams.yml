name: Update exam list
on:
  schedule: [{cron: "30 4 * * 1"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/exams.py
      - run: |
          git config user.name "exam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exams-ws2026.json
          git diff --cached --quiet || (git commit -m "Exam list update (public TUMonline data only)" && git push)
